[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-llm-json-extractor"
version = "0.1.0"
description = "Validated LLM extraction for invoices and resumes"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
openai = ["openai>=1.30,<3"]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
