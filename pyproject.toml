[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-llm-json-extractor"
version = "0.1.0"
description = "Validated LLM extraction and document Q&A"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
openai = ["openai>=1.30,<3"]
rag = [
  "langchain-chroma>=0.2,<1",
  "langchain-community>=0.3,<1",
  "langchain-openai>=0.3,<1",
  "langchain-text-splitters>=0.3,<1",
  "greenlet>=3.1.1,<3.2; python_version < '3.10'",
  "pypdf>=5,<7",
]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
